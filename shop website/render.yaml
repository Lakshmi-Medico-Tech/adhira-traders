services:
  # ATHIRA CRACKERS / ADHIRA TRADERS STOREFRONT
  - type: web
    name: adhira-traders-shop
    runtime: node
    plan: free
    region: singapore # Closest region to India / Tamil Nadu
    buildCommand: ""
    startCommand: node local-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
